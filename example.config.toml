# ==============================================================================
# ED Live Dashboard (EDLD) - config.toml
# ==============================================================================
#
# HOT-RELOAD: EDLD monitors this file for changes while running.
# Settings marked [HOT] take effect within ~1 second of saving.
# Settings marked [RESTART] require restarting EDLD to take effect.
# ==============================================================================

[Settings]

# [RESTART] Set to false on remote/secondary instances (e.g. a monitor PC reading
# journals over NFS) to prevent duplicate uploads to EDDN, EDSM, and EDAstro.
# The machine running the game should always be PrimaryInstance = true (default).
# PrimaryInstance = true

# [RESTART] Path to Elite Dangerous journal folder.
# Required - no default. Change requires restart as the file handle must reopen.
# JournalFolder = '\\SOMENETWORKSHARE\Users\me\Saved Games\Frontier Developments\Elite Dangerous'
# JournalFolder = "/home/username/games/ED-Logs/EDP1"
#
# JournalFolder = "C:\\Users\\YourName\\Saved Games\\Frontier Developments\\Elite Dangerous"
# JournalFolder = "C:/Users/YourName/Saved Games/Frontier Developments/Elite Dangerous"

# [HOT] Use UTC timestamps instead of local time (Default: false)
UseUTC = false

# [HOT] Send a warning if kills/hour drop below this amount (Default: 20)
WarnKillRate = 20

# [HOT] Minutes since last kill before sending a no-kill warning (Default: 20)
WarnNoKills = 20

# [HOT] Minutes since session start before the initial no-kill warning (Default: 5)
# This shorter threshold applies when no kills have occurred yet in the session.
WarnNoKillsInitial = 5

# [HOT] Minutes between repeated inactivity / kill-rate alerts (Default: 15)
WarnCooldown = 15

# [HOT] Mission stack size that triggers the "stack full" announcement (Default: 20)
FullStackSize = 20

# [HOT] Maximum number of characters to show in pilot/ship names (Default: 30)
TruncateNames = 30

# [HOT] Show faction name on each kill (Default: false)
BountyFaction = false

# [HOT] Show credits earned on each kill (Default: false)
BountyValue = false

# [HOT] Show extra stats e.g. kill counts and faction tallies (Default: false)
ExtendedStats = false

# [HOT] Show pirate pilot names in kill/scan messages (Default: false)
PirateNames = false

# [HOT] Minimum scan stage required to log an outgoing scan (Default: 1)
MinScanLevel = 1

[Discord]

# [RESTART] Discord webhook URL.
# The webhook object is built once at startup and cannot be changed on the fly.
# WebhookURL = 'https://discord.com/api/webhooks/1234567890/your-webhook-token-here'
WebhookURL = ''

# [RESTART] Your Discord user ID for pings (numbers only).
# Used to build ping strings at startup. Change requires restart.
# UserID = 123456789098765432
UserID = 0

# [RESTART] Set true if the webhook targets a forum channel (enables thread support)
ForumChannel = false

# [RESTART] Append a timestamp to Discord messages (Default: true)
Timestamp = true

# [RESTART] Use EDLD's default webhook name and avatar (Default: true)
# Set false to use the name/avatar configured in Discord's webhook settings.
Identity = true

# [HOT] Prepend the commander name to every Discord message (Default: false)
PrependCmdrName = false

# [RESTART] Use commander names as forum thread names (Default: false)
ThreadCmdrNames = false

[LogLevels]
# All notification levels are [HOT] - changes take effect on the next matching event.
#
# 0 = None
# 1 = Local only (no Discord)
# 2 = Local + Discord
# 3 = Local + Discord with @mention ping

RewardEvent      = 2   # Each kill — bounty or combat bond
FighterDamage    = 2   # Fighter hull integrity loss (~20% increments)
FighterLost      = 3   # Fighter destroyed
ShieldEvent      = 3   # Ship shield dropped or raised
HullEvent        = 3   # Ship hull damage
Died             = 3   # Ship destroyed
CargoLost        = 3   # Cargo stolen
CapiAuthRequired = 3   # Notifies on expired CAPI Authorization
LowCargoValue    = 2   # NPC declined to attack due to low cargo value
PoliceScan       = 2   # Security vessel scanned your ship
PoliceAttack     = 3   # Security vessel is attacking you
FuelStatus       = 1   # Routine fuel level report
FuelWarning      = 2   # Fuel below warning threshold
FuelCritical     = 3   # Fuel below critical threshold
MissionUpdate    = 2   # Mission accepted, completed, redirected, or removed
AllMissionsReady = 3   # All active massacre missions ready to turn in
MeritEvent       = 0   # Individual merit gain from a kill (powerplay only)
InactiveAlert    = 3   # No kills for the configured time period
RateAlert        = 3   # Kill rate below the configured threshold
InboundScan      = 1   # Incoming cargo scan from a pirate
PeriodicKills    = 2   # Kill count in the quarter-hour summary
PeriodicFaction  = 0   # Faction kill breakdown in the quarter-hour summary
PeriodicCredits  = 2   # Credits earned in the quarter-hour summary
PeriodicMerits   = 2   # Merits earned in the quarter-hour summary (powerplay only)

# Fleet / squadron carrier jump lifecycle.  A scheduled jump locks the carrier
# down for ~15 minutes: nothing can dock, and anyone aboard is going with it.
CarrierJumpScheduled = 3   # Jump scheduled — carrier, destination, countdown
CarrierJumpCancelled = 3   # A scheduled jump was cancelled
CarrierJumpComplete  = 2   # Carrier arrived at its destination

# ── CAPI ─────────────────────────────────────────────────────────────────────
# Frontier's Companion API.  Enable it from Preferences rather than here: the
# OAuth flow has to run to obtain a token, and the key below only gates
# whether EDLD polls once one exists.
#
[CAPI]
Enabled = false

# ── Colonisation ─────────────────────────────────────────────────────────────
# Local tracking of construction site requirements and delivery progress needs
# no key.  Supplying a Raven Colonial key additionally syncs your
# contributions with that community project.  Experimental.
#
[Colonisation]
# ApiKey = ""

# ── UI ───────────────────────────────────────────────────────────────────────
# The EDLD dashboard.  Three interfaces over the same windows and data:
#   textual   terminal dashboard (default)
#   gui       desktop window (needs PySide6)
#   terminal  plain scrolling output
#
[UI]
Mode       = "textual"         # textual (default) | terminal | gui
                               # CLI: --tui | --gui | --terminal
                               # (or the older --mode textual|terminal|gui)
Theme      = "default"         # built-in: "default", "default-dark",
                               #           "default-light", "default-blue",
                               #           "default-green", "default-purple",
                               #           "default-red", "default-yellow"
                               # custom:   "custom/mytheme"
                               #           (copy themes/custom-template.css into
                               #            themes/custom/ to start)
# ==============================================================================
# Data contributions (opt-in)
# ==============================================================================
# These sections enable uploading your journal data to community databases.
# All are opt-in and disabled by default.
# All require a restart when changed.
# ==============================================================================

# ── EDDN (Elite Dangerous Data Network) ─────────────────────────────────────
# Contributes exploration, market, outfitting, and shipyard data to the shared
# EDDN relay used by EDSM, Inara, and most third-party tools.

[EDDN]
# Overrides the anonymised uploader id EDLD derives from your commander name.
# Leave unset unless you have a reason to pin it.
# UploaderID = ""
Enabled    = false
# TestMode   = false   # send to /test schemas only (development use)

# ── EDSM (Elite Dangerous Star Map) ─────────────────────────────────────────
# Uploads your flight log and discoveries to edsm.net.
# Requires an EDSM account.  Generate your API key at:
#   https://www.edsm.net/en/settings/api

[EDSM]
Enabled       = false
# ApiKey        = ""               # from EDSM Settings → API Key
# Commander name is sourced from your journal — no CommanderName setting.

# ── EDAstro ──────────────────────────────────────────────────────────────────
# Uploads exploration, Odyssey organic scan, and fleet carrier data to edastro.com.
# Anonymous — no account or API key required.

[EDAstro]
Enabled             = false
UploadCarrierEvents = false   # set true to include CarrierStatus / CarrierJumpRequest
                              # note: this shares your carrier's location with EDAstro

# ── Inara ────────────────────────────────────────────────────────────────────
# Uploads commander stats, market visits, and fleet data to inara.cz.
# Requires an Inara account.  Generate your API key at:
#   https://inara.cz/elite/settings-api/

[Inara]
Enabled       = false
# ApiKey        = ""               # from Inara Settings → API Key
# Commander name is sourced from your journal — no CommanderName setting.

# ==============================================================================
# Session Management  [SessionMgmt]      ⚠  SOLO MODE ONLY
# ==============================================================================
# Optional and opt-in. Terminates the Elite Dangerous process when a trigger
# below fires. HARD-GATED to Solo play — it never acts in Open or Private Group
# (force-quitting in multiplayer is combat-logging). Off by default; set the
# master switch to enable. Toggle at runtime with Ctrl+K.
# See docs/guides/SESSION_MANAGEMENT.md   [HOT] all keys re-read live.
# ==============================================================================
[SessionMgmt]
# Master enable — leave false to keep every trigger inert.
Enabled                  = false

# Triggers (uncomment to use):
# QuitOnSLFDead          = false   # quit when your ship-launched fighter dies
# QuitOnLowFuel          = false   # quit on low main-tank fuel
# QuitOnLowFuelPercent   = 20      # fire at/below this fuel %
# QuitOnLowFuelMinutes   = 0       # also require <= this burn-time (min); 0 = % only
# QuitFuelSCGraceSeconds = 60      # no fuel quit in supercruise / this long after exit
# QuitOnLowHull          = false   # quit on low hull
# QuitOnLowHullThreshold = 10      # fire at/below this hull %

# Remote termination — for a [REMOTE]-style monitor instance that kills the game
# on another machine over SSH. Blank host terminates locally.
# RemoteKillHost         = ""
# RemoteKillUser         = ""

# Enable for a single commander only via a profile override:
# [EDP1.SessionMgmt]
# Enabled              = true
# QuitOnLowFuel        = true
# QuitOnLowFuelPercent = 15

# ── Surface Mining Survey ─────────────────────────────────────────────────────
# Planetary mining deposits are recorded automatically as you work them — the
# game emits no event carrying a position, so EDLD joins each refine to where
# Status.json says you were standing.  None of that needs configuring.
#
# This section is the optional other half: publishing your survey to a Google
# Sheet and reading back what other commanders found.  Setup is in
# sheets/README.md — you need a sheet, the Apps Script from sheets/Code.gs
# bound to it, and the URL and token it gives you.  Experimental.
#
[SurfaceSurvey]
Enabled          = false   # master switch for sharing; recording works regardless

# WebAppURL      = "https://script.google.com/macros/s/.../exec"
# Token          = ""      # the shared secret set in Code.gs; treat it as a password
# ReporterName   = ""      # fills the reported_by column; blank publishes anonymously

# Fetch          = true    # read other commanders' deposits on arriving at a body
# MarkFindsAsTest = false  # flag everything recorded from now on as test data
# IncludeTest    = false   # publish flagged rows too
# BatchSize      = 200     # deposits per request; Sheets allows ~60 writes/minute

# AutoConfirm    = true    # driving onto a known deposit refreshes its date
# ConfirmMetres  = 25.0    # how close that has to be

# ── Streamer Stats Overlay ────────────────────────────────────────────────────
# Small always-on-top windows drawn over the game — the subset of the dashboard
# worth putting on camera.  Off by default.
#
# Linux needs a running compositor (picom or equivalent) for transparency; i3
# and other non-compositing window managers do not start one, and without it the
# overlay paints an opaque panel instead.  Supported on X11, experimental on
# Windows, and impossible on Wayland, which does not let a client request
# always-on-top.  Nothing draws over exclusive fullscreen on any platform — run
# the game borderless windowed.
#
# Check what a machine can do:  edld.py --overlay-probe
# Ask why nothing is showing:   edld.py --overlay-doctor
#
[Overlay]
Enabled       = false

# Placement.  Margin is the gap between the monitor edge and the window; Pad is
# the gap inside it, between the window edge and the text.  Window height is not
# a setting — each window grows to fit what it is drawing.
# Anchor        = "top-centre"   # top-left|top-centre|top-right|bottom-left|bottom-centre|bottom-right
# Monitor       = 0              # 0-indexed; clamps to the last screen
# Width         = 720            # width of the top bar, which sets where its zones align
# MarginX       = 0
# MarginY       = 40
# PadX          = 16
# PadY          = 8
# DockWidth     = 260            # width of the left/right docked windows
# DockTop       = 140            # monitor top edge to the top of a dock

# Appearance.
# ColourTheme    = "elite-orange"  # any EDLD palette, or "custom" to use the three below
# FontFamily     = ""              # any installed family, plus anything in fonts/ or <data>/fonts/
# Opacity        = 0.85
# Scale          = 1.0
# ShadowOffset   = 1               # 0-2 px; 0 disables the text shadow
# ShadowStrength = 0.85            # multiplied by Opacity

# Survey compass, when that panel is shown.
# SpanDegrees   = 90               # width of the compass arc
# MaxTargets    = 5                # deposits marked on it at once

# ── Overlay panels ────────────────────────────────────────────────────────────
# Which panels appear, where, and what they show.  Easier to set in
# Preferences > Overlay than by hand — it lists every panel your components
# offer, which is not a fixed set.
#
# One key per panel per attribute:
#   PanelZone_<panel>   left | centre | right | dock-left | dock-right
#   PanelMode_<panel>   on | off | auto   (auto lets the panel decide if it applies)
#   PanelOrder_<panel>  1-9, position within its zone
#   PanelScope_<panel>  session | career | both   (only where both figures exist)
#
[OverlayPanels]
# HideMode    = "reserve"   # reserve keeps a hidden panel's space; collapse closes it up

# Type, used by every panel.
# TitleSize   = 12
# BodySize    = 13

# Only consulted when ColourTheme is "custom".
# TitleColour = "#7aa2d2"
# LabelColour = "#9aa4b2"
# ValueColour = "#cfd6e4"

# Example: commander and cargo down the left, the survey compass centred.
# PanelZone_commander = "left"
# PanelMode_commander = "on"
# PanelOrder_commander = 1
# PanelZone_cargo      = "left"
# PanelMode_cargo      = "auto"
# PanelOrder_cargo     = 2
# PanelZone_survey_compass = "centre"
# PanelMode_survey_compass = "auto"
# PanelScope_income    = "both"     # career figure with the session in parentheses

# ── Radio ────────────────────────────────────────────────────────────────────
# Stations for the Radio tab in the Crew / Alerts window.  [HOT] — the station
# list updates within a second of saving.  Nothing plays until you press play.
#
# The + and − beside the tab's station list add and delete stations here for
# you, touching only those stations' lines.  Or edit by hand, as follows.
#
# Two keys per station, joined by an Id of your choosing (letters, digits,
# _ and -; no spaces):
#   Name_<Id>   what the station list shows
#   Url_<Id>    the stream address (http:// or https://; .m3u/.pls also work)
#
# Streams must be MP3, Ogg Vorbis or FLAC.  AAC and Opus stations are listed
# but report "not supported" when played.
#
# To add a station, add a pair here, or in a profile to have it only there:
#   [EDP1]
#   Radio.Name_MyStation = "My Station"
#   Radio.Url_MyStation  = "https://example.org:8000/stream"
#
# To hide a station, set its Url to "".  Deleting the lines is not enough for
# the three below: EDLD puts missing defaults back into this section.
#
[Radio]
Name_RadioSidewinder = "Radio Sidewinder"
Url_RadioSidewinder  = "https://radiosidewinder.out.airtime.pro:8000/radiosidewinder_b"
Name_HuttonOrbital   = "Hutton Orbital Radio"
Url_HuttonOrbital    = "https://quincy.torontocast.com/hutton"
Name_RadioSkvortsov  = "Radio Skvortsov"
Url_RadioSkvortsov   = "https://cast1.torontocast.com:3225/stream"

# ==============================================================================
# [Server] — the EDAM mobile client
# ==============================================================================
# Lets paired phones and tablets show this EDLD's commander, ship, session and
# career figures.  Off unless Enabled is true or EDLD is started with -s.
# Pair a device with:  edld --pair   (list with --paired, remove with --unpair)
# Nothing is sent to any device you have not paired.  See docs/SERVER.md.
#
# Port            the TCP port devices connect to.  To use the app away from
#                 home, forward this port on your router to this computer.
#                 Two profiles running at once need two different ports.
# BindAddress     blank listens on every interface, IPv6 and IPv4.
# ExternalHost    how devices reach you from outside, e.g. yourname.duckdns.org
#                 or yourname.duckdns.org:28510.  Only written into pairing
#                 codes; EDLD never looks it up or connects to it.
# AllowEndSession let a paired device end the game session.  Solo mode only,
#                 the same rule as session management's own triggers.
[Server]
Enabled         = false
Port            = 28510
BindAddress     = ""
ExternalHost    = ""
AllowEndSession = false

# ==============================================================================
# Custom profiles (advanced)
# ==============================================================================
# Profiles override any setting above for a specific commander or use case.
# Load a profile with:  edld.py -p ProfileName
# Or name the profile after your commander for automatic selection at startup.
#
# [RESTART] Profile selection requires a restart.
# Individual settings within a profile follow the same HOT/RESTART rules above.
# ==============================================================================

# Windows example:
[EDP1]
Settings.JournalFolder = "C:/Users/YourName/Saved Games/Frontier Developments/Elite Dangerous"
Discord.UserID         = 123456789098765432
Discord.WebhookURL     = 'https://discord.com/api/webhooks/1234567890/your-webhook-token-here'

# Linux example:
[EDP2]
Settings.JournalFolder = "/home/username/games/ED-Logs/EDP1"
Discord.UserID         = 123456789098765432
Discord.WebhookURL     = 'https://discord.com/api/webhooks/1234567890/your-webhook-token-here'


# ==============================================================================
# [REMOTE] profile — dashboard front-end for remote monitoring
# ==============================================================================
# Used when running EDLD on a second machine (e.g. a laptop) against a game
# machine's journal directory, mounted via sshfs.
#
# Discord is intentionally disabled — the game machine's EDLD instance handles
# all webhook output. This instance provides the dashboard only.
#
# See docs/REMOTE_ACCESS.md for full setup instructions.
# ==============================================================================

[REMOTE]
Settings.JournalFolder = "/home/username/mnt/ed-journals"
UI.Mode                = "textual"
UI.Theme               = "default"
Discord.WebhookURL     = ""
Discord.UserID         = 0
Discord.Identity       = false

[REMOTE.LogLevels]
RewardEvent      = 1
FighterDamage    = 1
FighterLost      = 1
ShieldEvent      = 1
HullEvent        = 1
Died             = 1
CargoLost        = 1
LowCargoValue    = 1
PoliceScan       = 1
PoliceAttack     = 1
FuelStatus       = 1
FuelWarning      = 1
FuelCritical     = 1
MissionUpdate    = 1
AllMissionsReady = 1
MeritEvent       = 1
InactiveAlert    = 1
RateAlert        = 1
InboundScan      = 1
PeriodicKills    = 1
PeriodicFaction  = 0
PeriodicCredits  = 1
PeriodicMerits   = 1
